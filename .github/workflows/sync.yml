name: 自动同步 Qist TVBox 仓库并生成接口

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1

      - name: 2. 获取 upstream 最新 commit 信息
        run: |
          API_JSON=$(curl -s https://api.github.com/repos/qist/tvbox/commits/main)
          UPSTREAM_SHA=$(echo "$API_JSON" | jq -r '.sha')

          cd main_repo
          LOCAL_SHA=$(git rev-parse HEAD)

          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "LOCAL_SHA=$LOCAL_SHA" >> $GITHUB_ENV

      - name: 3. 判断上游是否更新
        run: |
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "UPSTREAM_UPDATED=false" >> $GITHUB_ENV
          else
            echo "UPSTREAM_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: 4. 上游无更新时检查哪些文件缺失或未加密
        if: env.UPSTREAM_UPDATED == 'false'
        run: |
          cd main_repo
          NEED_UPDATE=false

          # 检查 jsm.txt
          if [ ! -f "jsm.txt" ]; then
            echo "缺失 jsm.txt"
            NEED_JSM=true
            NEED_UPDATE=true
          fi

          # 检查 fty.txt
          if [ ! -f "fty.txt" ]; then
            echo "缺失 fty.txt"
            NEED_FTY=true
            NEED_UPDATE=true
          fi

          # 检查 xiaosa/api.txt
          if [ ! -f "xiaosa/api.txt" ]; then
            echo "缺失 xiaosa/api.txt"
            NEED_XIAOSA=true
            NEED_UPDATE=true
          fi

          # 检查 tvboxtv.txt 是否已 Base64 加密
          if ! grep -q "base64://" tvboxtv.txt; then
            echo "tvboxtv.txt 未加密"
            NEED_TVBOXTV=true
            NEED_UPDATE=true
          fi

          # 输出标记
          echo "NEED_UPDATE=$NEED_UPDATE" >> $GITHUB_ENV
          echo "NEED_JSM=${NEED_JSM}" >> $GITHUB_ENV
          echo "NEED_FTY=${NEED_FTY}" >> $GITHUB_ENV
          echo "NEED_XIAOSA=${NEED_XIAOSA}" >> $GITHUB_ENV
          echo "NEED_TVBOXTV=${NEED_TVBOXTV}" >> $GITHUB_ENV

          # 如果全部满足 → 结束工作流
          if [ "$NEED_UPDATE" != "true" ]; then
            echo "所有文件已准备好，结束工作流"
            exit 0
          fi

      - name: 5. 上游无更新时补缺的文件
        if: env.UPSTREAM_UPDATED == 'false'
        run: |
          cd main_repo

          # 补 jsm.txt
          if [ "$NEED_JSM" = "true" ]; then
            python tools/tvbox.py jsm.json jsm.txt enc
            echo "已生成 jsm.txt"
          fi

          # 补 fty.txt
          if [ "$NEED_FTY" = "true" ]; then
            python tools/tvbox.py fty.json fty.txt enc
            echo "已生成 fty.txt"
          fi

          # 补 xiaosa/api.txt
          if [ "$NEED_XIAOSA" = "true" ]; then
            python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc
            echo "已生成 xiaosa/api.txt"
          fi

          # 补 tvboxtv.txt（Base64 加密）
          if [ "$NEED_TVBOXTV" = "true" ]; then
            ENCODED=$(base64 -w 0 tvboxtv.txt)
            echo "base64://$ENCODED" > tvboxtv.txt
            echo "tvboxtv.txt 已加密"
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "补齐缺失文件（无上游更新）"
          git push

      - name: 6. 拉取 upstream 最新文件（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1

      - name: 7. 同步文件（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          rsync -av \
            --delete \
            --times \
            --exclude='.git' \
            --exclude='.github' \
            qist_repo/ main_repo/

      - name: 8. 上游有更新时加密所有文件
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          cd main_repo
          python tools/tvbox.py jsm.json jsm.txt enc
          python tools/tvbox.py fty.json fty.txt enc
          python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc

          ENCODED=$(base64 -w 0 tvboxtv.txt)
          echo "base64://$ENCODED" > tvboxtv.txt
          echo "tvboxtv.txt 已加密"

      - name: 9. 上游有更新时提交
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          cd main_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "同步上游更新"
          git push
