name: 自动同步 Qist TVBox 仓库并生成接口

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取当前仓库
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1

      - name: 获取 upstream 最新 SHA
        run: |
          UPSTREAM_SHA=$(curl -s https://api.github.com/repos/qist/tvbox/commits/main | sed -n 's/.*"sha": "\(.*\)".*/\1/p' | head -n 1)
          cd main_repo
          LOCAL_SHA=$(git rev-parse HEAD)

          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "LOCAL_SHA=$LOCAL_SHA" >> $GITHUB_ENV

      - name: 判断上游是否更新
        run: |
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "UPSTREAM_UPDATED=false" >> $GITHUB_ENV
          else
            echo "UPSTREAM_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: 上游无更新时检查缺失文件
        if: env.UPSTREAM_UPDATED == 'false'
        run: |
          cd main_repo
          NEED_UPDATE=false

          [ ! -f "jsm.txt" ] && NEED_JSM=true && NEED_UPDATE=true
          [ ! -f "fty.txt" ] && NEED_FTY=true && NEED_UPDATE=true
          [ ! -f "xiaosa/api.txt" ] && NEED_XIAOSA=true && NEED_UPDATE=true

          # tvbox.py 加密后的文件以 "$#" 开头
          if ! grep -q "\$#" tvboxtv.txt; then
            NEED_TVBOXTV=true
            NEED_UPDATE=true
          fi

          echo "NEED_UPDATE=$NEED_UPDATE" >> $GITHUB_ENV
          echo "NEED_JSM=$NEED_JSM" >> $GITHUB_ENV
          echo "NEED_FTY=$NEED_FTY" >> $GITHUB_ENV
          echo "NEED_XIAOSA=$NEED_XIAOSA" >> $GITHUB_ENV
          echo "NEED_TVBOXTV=$NEED_TVBOXTV" >> $GITHUB_ENV

          if [ "$NEED_UPDATE" != "true" ]; then
            echo "所有文件已准备好，结束工作流"
            exit 0
          fi

      - name: 初始化 Python（必须）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 pycryptodome（必须）
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 上游无更新时补齐缺失文件
        if: env.UPSTREAM_UPDATED == 'false'
        run: |
          cd main_repo

          [ "$NEED_JSM" = "true" ] && python tools/tvbox.py jsm.json jsm.txt enc
          [ "$NEED_FTY" = "true" ] && python tools/tvbox.py fty.json fty.txt enc
          [ "$NEED_XIAOSA" = "true" ] && python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc

          if [ "$NEED_TVBOXTV" = "true" ]; then
            ENCODED=$(base64 -w 0 tvboxtv.txt)
            echo "base64://$ENCODED" > tvboxtv.txt
            echo "tvboxtv.txt 已使用 Base64 加密"
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "补齐缺失文件（无上游更新）"
          git push

      - name: 拉取 upstream（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1

      - name: 同步文件（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          rsync -av \
            --delete \
            --times \
            --exclude='.git' \
            --exclude='.github' \
            qist_repo/ main_repo/

      - name: 上游有更新时加密所有文件
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          cd main_repo
          python tools/tvbox.py jsm.json jsm.txt enc
          python tools/tvbox.py fty.json fty.txt enc
          python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc

          ENCODED=$(base64 -w 0 tvboxtv.txt)
          echo "base64://$ENCODED" > tvboxtv.txt
          echo "tvboxtv.txt 已使用 Base64 加密"

      - name: 上游有更新时提交
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          cd main_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "同步上游更新"
          git push
