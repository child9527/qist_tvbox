name: 自动同步 Qist TVBox 仓库并生成接口

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1

      - name: 安装 jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 2. 获取 upstream 最新 commit 信息（不拉历史）
        run: |
          API_JSON=$(curl -s https://api.github.com/repos/qist/tvbox/commits/main)
          UPSTREAM_COMMIT=$(echo "$API_JSON" | jq -r '.commit.message')
          # 尝试获取 committer.date 或 author.date
          RAW_TIME=$(echo "$API_JSON" | jq -r '.commit.committer.date // .commit.author.date')
          # 如果 RAW_TIME 是 null 或空字符串，则使用当前时间
          if [ "$RAW_TIME" = "null" ] || [ -z "$RAW_TIME" ]; then
            RAW_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> $GITHUB_ENV
          echo "UPSTREAM_TIME=$RAW_TIME" >> $GITHUB_ENV

      - name: 3. 拉取 upstream 最新文件（轻量）
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1

      - name: 4. 同步文件（镜像）
        run: |
          rsync -av \
            --delete \
            --times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools/tvbox.py' \
            qist_repo/ main_repo/

      - name: 5. 初始化 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 6. 安装官方依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 7. 额外生成加密副本 xxx.txt 
        run: |
          cd main_repo
          # 对最终合成好的完整 json 文件进行加密生成 .txt 副本
          if [ -f "tools/tvbox.py" ]; then
            [ -f "jsm.json" ] && python tools/tvbox.py jsm.json jsm.txt enc || true
            [ -f "fty.json" ] && python tools/tvbox.py fty.json fty.txt enc || true
            [ -f "xiaosa/api.json" ] && python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc || true
          fi

      - name: 8. 使用 upstream 的 commit 信息提交（伪造 upstream 提交）
        run: |
          cd main_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --staged --quiet; then
            echo "无更新，跳过提交"
          else
            git commit -m "$UPSTREAM_COMMIT"
            git push
          fi
