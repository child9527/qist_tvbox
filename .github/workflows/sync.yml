name: 自动同步 Qist TVBox 仓库并生成接口

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    name: 执行 Qist 官方构建流程
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1

      - name: 2. 拉取 upstream 上游仓库 (qist/tvbox)
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1

      - name: 3. 初始化 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 安装官方依赖库
        run: |
          python -m pip install --upgrade pip
          pip install demjson3 pycryptodome requests

      - name: 5. 按照 upstream 的流程处理 xiaosa 与 fty 接口
        run: |
          echo "======== 1. 处理 xiaosa (包含 jsm.json) ========"
          cd qist_repo/tools
          
          # 解密上游 one.json 并做本地化处理
          python tvbox.py https://9877.kstore.space/one.json xs.json dec
          python build_local.py xs.json output
          mkdir -p ../xiaosa
          \cp -pdr output/* ../xiaosa/
          
          # 运行 xiao.py 和合并脚本生成完整版 jsm.json 与 dianshi.json
          python xiao.py ../xiaosa/api.json dianshi.json
          python xiao.py ../xiaosa/api.json jsm.json
          python copy_xbpq.py dianshi_with_app_sites.json
          
          # 覆盖输出到根目录
          \cp -pdr dianshi_with_app_sites.json ../dianshi.json
          \cp -pdr jsm_with_app_sites.json ../jsm.json
          mkdir -p ../jar
          \cp -pdr ../xiaosa/spider.jar ../jar/spider.jar
          
          echo "======== 2. 处理 fty (fty.json) ========"
          python tvbox.py https://www.xn--sss604efuw.net/tv ty.json dec
          python fty.py ty.json
          \cp -pdr tvbox_cleaned.json ../fty.json
          \cp -pdr fan.txt ../jar/fan.txt
          
          echo "======== 3. 同步产物到主仓库 ========"
          cd ../..
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            qist_repo/ main_repo/

      - name: 6. 额外生成加密副本 .txt (如需保存加密版)
        run: |
          cd main_repo
          # 对最终合成好的完整 json 文件进行加密生成 .txt 副本
          if [ -f "tools/tvbox.py" ]; then
            [ -f "jsm.json" ] && python tools/tvbox.py jsm.json jsm.txt enc || true
            [ -f "fty.json" ] && python tools/tvbox.py fty.json fty.txt enc || true
            [ -f "xiaosa/api.json" ] && python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc || true
          fi

      - name: 7. 提交并推送至 GitHub
        run: |
          cd main_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "[提示] 没有文件更新，跳过 Commit。"
          else
            LOG_TIME=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "Auto: 按照 Qist 流程完整同步并构建接口 [${LOG_TIME}]"
            git push
            echo "======== 成功推送到 GitHub 远程仓库 ========"
          fi
