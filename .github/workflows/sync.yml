name: 自动同步 Qist TVBox 仓库并加密配置文件

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 15:00) 自动触发
    - cron: '0 7 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动点击按钮立即触发

# 显式赋予 GitHub Actions 写入仓库的权限
permissions:
  contents: write

jobs:
  sync-and-encrypt:
    name: 同步与加密任务
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前用户仓库 (主仓库 - 仅拉取最新一层，防止体积膨胀)
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1 # 只拉取最新 Commit，杜绝历史体积膨胀

      - name: 2. 拉取 upstream 上游仓库 (qist/tvbox - 仅拉取最新一层)
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1 # 仅拉取最新代码

      - name: 3. 初始化 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 安装 Python AES 加密依赖库
        run: |
          echo "======== 开始安装 Python 依赖库 ========"
          python -m pip install --upgrade pip
          pip install pycryptodome
          echo "======== 依赖库安装完成 ========"

      - name: 5. 自动补全缺失文件并执行 rsync 增量同步
        run: |
          echo "======== 检查并补全初始环境 ========"
          
          # 检查本地是否有 tools/tvbox.py，若没有则从上游自动补全
          if [ ! -f "main_repo/tools/tvbox.py" ]; then
            echo "[初始化] 检查到本地缺少 tools/tvbox.py，正在从上游 qist/tvbox 复制初始文件..."
            mkdir -p main_repo/tools
            cp qist_repo/tools/tvbox.py main_repo/tools/tvbox.py
          else
            echo "[跳过] 本地已存在 tools/tvbox.py，将保留本地版本。"
          fi

          echo "======== 开始从 qist/tvbox 增量同步文件 ========"
          
          # 执行 rsync 操作，同步上游资源并保留本地特有目录
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='tools/tvbox.py' \
            qist_repo/ main_repo/
            
          echo "======== 上游仓库同步完毕 ========"

      - name: 6. 运行本地加密脚本并生成 .txt 副本，恢复原 .json
        run: |
          echo "======== 开始运行 JSON 文件加密逻辑 ========"
          cd main_repo
          if [ -f "scripts/sync_and_encrypt.py" ]; then
            # 1. 正常运行原有的加密脚本（会原地覆盖 .json 文件）
            python scripts/sync_and_encrypt.py
            
            echo "======== 开始处理文件副本与恢复原 .json ========"
            # 2. 将加密后的文件备份成 .txt 扩展名副本
            [ -f "fty.json" ] && cp fty.json fty.txt && echo "[副本] 已生成 fty.txt"
            [ -f "jsm.json" ] && cp jsm.json jsm.txt && echo "[副本] 已生成 jsm.txt"
            [ -f "xiaosa/api.json" ] && cp xiaosa/api.json xiaosa/api.txt && echo "[副本] 已生成 xiaosa/api.txt"

            # 3. 从上游拉取的内容（qist_repo）中把未加密的原 .json 重新复制覆盖回来
            cd ..
            [ -f "qist_repo/fty.json" ] && cp qist_repo/fty.json main_repo/fty.json && echo "[恢复] 已还原原文件 fty.json"
            [ -f "qist_repo/jsm.json" ] && cp qist_repo/jsm.json main_repo/jsm.json && echo "[恢复] 已还原原文件 jsm.json"
            [ -f "qist_repo/xiaosa/api.json" ] && cp qist_repo/xiaosa/api.json main_repo/xiaosa/api.json && echo "[恢复] 已还原原文件 xiaosa/api.json"
          else
            echo "[警告] 未找到 scripts/sync_and_encrypt.py 脚本！"
            exit 1
          fi

      - name: 7. 提交并推送原文件与加密副本至 GitHub
        run: |
          cd main_repo
          echo "======== 开始检查文件变动并准备提交 ========"
          
          # 配置 Git 提交身份信息
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存所有同步更新（包含原 json 文件及新生成的 .txt 加密副本）
          git add .
          
          # 详细打印被改动的文件列表
          echo "[日志] 当前被修改或新增的文件列表如下："
          git status --short
          
          # 检查是否有文件改动
          if git diff --staged --quiet; then
            echo "[提示] 经对比，本地仓库与上游内容完全一致且无任何文件变更，跳过本次 Commit 提交。"
          else
            LOG_TIME=$(date +'%Y-%m-%d %H:%M:%S')
            echo "[信息] 检查到文件存在更新，准备提交代码，时间标志: ${LOG_TIME}"
            git commit -m "Auto: 全量同步 qist/tvbox 并保留原文件同时生成 .txt 加密副本 [${LOG_TIME}]"
            git push
            echo "======== 成功推送到 GitHub 远程仓库 ========"
          fi
