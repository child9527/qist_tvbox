name: 自动同步 Qist TVBox 仓库并生成接口

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    name: 同步 Qist/TVBox 仓库并生成加密文件
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1

      - name: 2. 拉取 upstream 上游仓库 (qist/tvbox)
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1

      - name: 3. 初始化 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 安装官方依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 5. 同步产物到主仓库
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools/tvbox.py' \
            qist_repo/ main_repo/

      - name: 6. 额外生成加密副本 xxx.txt 
        run: |
          cd main_repo
          # 对最终合成好的完整 json 文件进行加密生成 .txt 副本
          if [ -f "tools/tvbox.py" ]; then
            [ -f "jsm.json" ] && python tools/tvbox.py jsm.json jsm.txt enc || true
            [ -f "fty.json" ] && python tools/tvbox.py fty.json fty.txt enc || true
            [ -f "xiaosa/api.json" ] && python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc || true
          fi

      - name: 7. 提交并推送至 GitHub
        run: |
          cd main_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "[提示] 没有文件更新，跳过 Commit。"
          else
            LOG_TIME=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "Auto: 同步 qist/tvbox仓库内容，并生成加密文件 [${LOG_TIME}]"
            git push
            echo "======== 成功同步 qist/tvbox 仓库内容 ========"
          fi
