name: 自动同步 Qist TVBox 仓库并生成接口

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4
        with:
          path: main_repo
          fetch-depth: 1

      - name: 安装 jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 2. 获取 upstream 最新 commit 信息（不拉历史）
        run: |
          # 获取 upstream 最新 commit SHA
          UPSTREAM_SHA=$(curl -s https://api.github.com/repos/qist/tvbox/commits/main | jq -r '.sha')

          # 获取当前仓库最新 commit SHA
          cd main_repo
          LOCAL_SHA=$(git rev-parse HEAD)

          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "LOCAL_SHA=$LOCAL_SHA" >> $GITHUB_ENV

      - name: 3. 判断 upstream 是否更新
        run: |
          echo "Upstream SHA: $UPSTREAM_SHA"
          echo "Local SHA:    $LOCAL_SHA"

          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "上游无更新，进入文件检查逻辑"
            echo "UPSTREAM_UPDATED=false" >> $GITHUB_ENV
          else
            echo "上游有更新，需要同步"
            echo "UPSTREAM_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: 4. 如果上游无更新，检查加密文件是否存在
        if: env.UPSTREAM_UPDATED == 'false'
        run: |
          cd main_repo
          MISS=false

          [ -f "jsm.txt" ] || MISS=true
          [ -f "fty.txt" ] || MISS=true
          [ -f "xiaosa/api.txt" ] || MISS=true

          if [ "$MISS" = "false" ]; then
            echo "加密文件已存在，无需生成，结束工作流"
            exit 0
          else
            echo "加密文件缺失，需要生成"
          fi

      - name: 5. 拉取 upstream 最新文件（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'qist/tvbox'
          path: qist_repo
          fetch-depth: 1

      - name: 6. 同步文件（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          rsync -av \
            --delete \
            --times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools/tvbox.py' \
            qist_repo/ main_repo/

      - name: 7. 初始化 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 8. 安装官方依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 9. 生成加密文件（无论上游是否更新，只要缺失就生成）
        run: |
          cd main_repo
          if [ -f "tools/tvbox.py" ]; then
            [ -f "jsm.json" ] && python tools/tvbox.py jsm.json jsm.txt enc || true
            [ -f "fty.json" ] && python tools/tvbox.py fty.json fty.txt enc || true
            [ -f "xiaosa/api.json" ] && python tools/tvbox.py xiaosa/api.json xiaosa/api.txt enc || true
          fi

      - name: 10. 提交（仅当上游有更新）
        if: env.UPSTREAM_UPDATED == 'true'
        run: |
          cd main_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --staged --quiet; then
            echo "无更新，跳过提交"
          else
            git commit -m "同步上游：$UPSTREAM_SHA"
            git push
          fi
