name: 执行 JSON 加解密验证

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypt-decrypt-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4

      - name: 2. 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 4. 执行多重加解密流程
        run: |
          files=("jsm.json" "fty.json" "xiaosa/api.json")

          if [ -f "tools/tvbox.py" ]; then
            for file in "${files[@]}"; do
              if [ -f "$file" ]; then
                base="${file%.json}"
                
                # 1. 原始 json 加密生成 _enc1.txt
                python tools/tvbox.py "$file" "${base}_enc1.txt" enc || true
                
                # 2. 将 _enc1.txt 解密生成 _dec1.txt
                python tools/tvbox.py "${base}_enc1.txt" "${base}_dec1.txt" dec || true
                
                # 3. 再将 _dec1.txt 加密生成 _enc2.txt
                python tools/tvbox.py "${base}_dec1.txt" "${base}_enc2.txt" enc || true
              fi
            done
          else
            echo "错误: 未找到 tools/tvbox.py 加密脚本"
            exit 1
          fi

      - name: 5. 比较 enc1 与 enc2 内容差异
        run: |
          files=("jsm.json" "fty.json" "xiaosa/api.json")

          echo "==================== 比较结果 ===================="
          for file in "${files[@]}"; do
            base="${file%.json}"
            enc1="${base}_enc1.txt"
            enc2="${base}_enc2.txt"

            if [ -f "$enc1" ] && [ -f "$enc2" ]; then
              if cmp -s "$enc1" "$enc2"; then
                echo "【无差异】$enc1 与 $enc2 内容完全一致！"
              else
                echo "【有差异】$enc1 与 $enc2 内容存在区别！"
              fi
            else
              echo "【跳过】未找到对应的对比文件: $enc1 或 $enc2"
            fi
          done
          echo "=================================================="

      - name: 6. 提交生成的 txt 文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --staged --quiet; then
            echo "无文件变更，跳过提交"
          else
            git commit -m "chore: 生成加解密测试文件并对比日志"
            git push
          fi
