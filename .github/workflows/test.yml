name: mtv6.txt加密为mtv6.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-decrypt-encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取当前仓库
        uses: actions/checkout@v4

      - name: 2. 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 4. 下载远程 mtv6.txt 并执行加解密流程
        run: |
          # 1. 从远程网盘下载 mtv6.txt 到仓库根目录
          echo "正在从 https://d.kstore.dev/download/2843/mtv6.txt 下载目标文件..."
          curl -sSL "https://d.kstore.dev/download/2843/mtv6.txt" -o "mtv6.txt"

          if [ ! -f "mtv6.txt" ]; then
            echo "错误: 下载 mtv6.txt 失败！"
            exit 1
          fi

          if [ ! -f "tools/tvbox.py" ]; then
            echo "错误: 未找到 tools/tvbox.py 加密工具脚本"
            exit 1
          fi

          echo "正在加密 mtv6.txt -> mtv6.json ..."
          python tools/tvbox.py "mtv6.txt" "mtv6.json" enc || true


      - name: 6. 提交
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --staged --quiet; then
            echo "无文件变更，跳过提交"
          else
            git commit -m "完成"
            git push
          fi
