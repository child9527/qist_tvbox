name: Test Encrypt JSON

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发运行

jobs:
  run-encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装加密算法依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 执行加密脚本
        run: |
          python sync_and_encrypt.py
