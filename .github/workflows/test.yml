name: Test Encrypt JSON

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发运行

# 显式声明授予 Actions 写权限，解决 403 错误
permissions:
  contents: write

jobs:
  run-encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装加密算法依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: 执行加密脚本
        run: |
          python scripts/sync_and_encrypt.py

      - name: 提交并推送加密后的文件到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fty.txt jsmbak.json xiaosa/api.txt
          # 检查是否有变更，有变更才提交，避免报错
          git diff --staged --quiet || git commit -m "auto: 自动更新加密文件 [skip ci]"
          git push
